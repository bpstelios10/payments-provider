plugins {
    id 'org.springframework.boot' version "${springBootVersion}" apply false
    id 'io.spring.dependency-management' version "${dependencyManagementVersion}" apply false
}

ext {
    versions = [
            // the versions should match whatever our spring version is using
            junitJupiter: '6.0.3',
            mockitoJunitJupiter: '5.23.0',
            assertj: '3.27.7',
            kafkaClients: '4.2.0',
            jacksonDatabind: '3.1.0',
            slf4j: '2.0.17',
            micrometerPrometheus: '1.17.0-M3',
            // not Spring BOM related
            postgreSql: '42.7.8',
            awaitility: '4.3.0',
            lombok: '1.18.44'
    ]

    javaProjects = ['payments-service', 'transactions-service', 'messaging-outbox-core', 'messaging-outbox-spring-jpa', 'messaging-events-core']
    springWebProjects = ['payments-service', 'transactions-service']
}

group = 'org.learnings.payments'
version = '1.0-SNAPSHOT'

allprojects {
    repositories {
        mavenCentral()
    }
}

subprojects { subproj ->
    ext.versions = rootProject.ext.versions

    if (javaProjects.contains(subproj.name)) {
        apply plugin: 'java'

        java {
            sourceCompatibility = JavaVersion.VERSION_25
            targetCompatibility = JavaVersion.VERSION_25
        }

        dependencies {
            testImplementation("org.junit.jupiter:junit-jupiter-api:${versions.junitJupiter}")
            testImplementation("org.junit.jupiter:junit-jupiter-params:${versions.junitJupiter}")
            testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:${versions.junitJupiter}")
            testRuntimeOnly("org.junit.platform:junit-platform-launcher:${versions.junitJupiter}")
            testImplementation("org.mockito:mockito-junit-jupiter:${versions.mockitoJunitJupiter}")
            testImplementation("org.assertj:assertj-core:${versions.assertj}")
            test.useJUnitPlatform()
        }

        apply from: '../gradle/jacoco.gradle'
    }

    if (springWebProjects.contains(subproj.name)) {
        apply plugin: 'org.springframework.boot'
        apply plugin: 'io.spring.dependency-management'

        dependencies {
            implementation 'org.springframework.boot:spring-boot-starter-web'
            implementation 'org.springframework.boot:spring-boot-starter-actuator'
            implementation 'org.springframework.boot:spring-boot-starter-validation'

            implementation "io.micrometer:micrometer-registry-prometheus:${versions.micrometerPrometheus}"

            compileOnly "org.projectlombok:lombok:${versions.lombok}"
            annotationProcessor "org.projectlombok:lombok:${versions.lombok}"

            testImplementation("org.springframework.boot:spring-boot-starter-webmvc-test")
        }

        jar.enabled=false
        bootJar.archiveFileName='service.jar'

        tasks.withType(Test).configureEach {
            // Increase this to 1536m or 2048m for Embedded Kafka
            maxHeapSize = "1024m"

            // Reduces memory pressure by running tests sequentially
//            maxParallelForks = 1
        }
    }
}

wrapper {
    gradleVersion = "9.2.0"
}
